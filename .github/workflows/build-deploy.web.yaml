name: "Build & Deploy Carbon Lens Web App"

on:
  push:
    branches:
      - main
    paths:
      - app/web/**
      - .github/workflows/build-deploy.web.yaml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: carbon—lens-web
  IMAGE_REPOSITORY: data354/carbon-lens
  STACK_SERVICE_NAME: carbon-lens_web

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install \
            --frozen-lockfile \
            --filter "@carbon-lens/web"

      - name: Build web app
        run: |
          bun --filter "@carbon-lens/web" build

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --build-arg APP_URL=http://$HOST \
            --build-arg API_URL=http://$HOST/api \
            --tag $REGISTRY/$IMAGE_REPOSITORY/$IMAGE_NAME:latest \
            --tag $REGISTRY/$IMAGE_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA \
            .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_REPOSITORY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker login \
              --username ${{ github.actor }} \
              --password ${{ secrets.GHCR_PAT }} \
              $REGISTRY

            docker service update \
              --image $REGISTRY/$IMAGE_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA \
              ${{ env.STACK_SERVICE_NAME }}
