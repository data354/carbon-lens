name: ${PROJECT_NAME}

services:
  app-postgres:
    image: postgres:13.22-alpine3.21
    restart: unless-stopped
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-pgsql-data:/var/lib/postgresql/data
    networks:
      - base-net

  api:
    image: ghcr.io/data354/carbon-lens-api:latest@sha256:3e984a7bd5083f71457b2512caad7924a2afcbef88040e6f6c25b8ade3feb761
    # build:
    #   context: ../apps/api
    #   dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - ${API_PORT}
    env_file:
      - ../apps/api/.env
    networks:
      - base-net

  web:
    image: ghcr.io/data354/carbon-lens-web:0.1.2@sha256:7ace0dc3d4cf0a751835640148023b12b12cb1c3a329e92d154c83db59c9a11c
    # build:
    #   context: ..
    #   dockerfile: apps/web/Dockerfile
    #   args:
    #     - APP_URL=http://localhost
    #     - API_URL=http://localhost/api
    restart: unless-stopped
    expose:
      - ${WEB_PORT}
    env_file:
      - ../apps/web/.env.development.docker
    environment:
      - NODE_ENV=production
    depends_on:
      app-postgres:
        condition: service_healthy
    networks:
      - base-net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - base-net
    depends_on:
      - web

networks:
  base-net:
    driver: bridge

volumes:
  app-pgsql-data:
    driver: local
