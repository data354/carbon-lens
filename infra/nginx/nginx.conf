log_format timing
  'ts="$time_iso8601" '
  'client="$remote_addr" '
  'method="$request_method" '
  'uri="$request_uri" '
  'status=$status '
  'bytes=$body_bytes_sent '
  'rt=$request_time '
  'uct="$upstream_connect_time" '
  'uht="$upstream_header_time" '
  'urt="$upstream_response_time" '
  'upstream="$upstream_addr" '
  'ustatus="$upstream_status"';

access_log /var/log/nginx/access.log timing;

# Rate limiting per client IP on API endpoints
limit_req_zone $binary_remote_addr zone=api_tiles:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_geo:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_catalog:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_export:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_geometry:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
  listen 80;

  server_name _;

  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  # Overwrite (not append) so that clients cannot spoof their IP
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_http_version 1.1;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_buffering on;
  proxy_buffers 16 16k;
  proxy_buffer_size 32k;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;

  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"status":"healthy"}';
  }

  location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
    return 404;
  }

  location /api/auth/ {
    set $upstream http://web:3000;
    proxy_pass $upstream;
  }

  location /api/ {
    set $upstream http://api:8080;
    proxy_pass $upstream;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Map tiles: a single view loads dozens of tiles at once
  location /api/tiles/ {
    limit_req zone=api_tiles burst=200 nodelay;
    set $upstream http://api:8080;
    proxy_pass $upstream;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Statistics on an uploaded geometry: heavy raster processing
  location = /api/tiles/stats/geometry {
    limit_req zone=api_geometry burst=5 nodelay;
    set $upstream http://api:8080;
    proxy_pass $upstream;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location /api/geo/ {
    limit_req zone=api_geo burst=30 nodelay;
    set $upstream http://api:8080;
    proxy_pass $upstream;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location /api/catalog/ {
    limit_req zone=api_catalog burst=20 nodelay;
    set $upstream http://api:8080;
    proxy_pass $upstream;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # CSV exports
  location = /api/files/download {
    limit_req zone=api_export burst=5 nodelay;
    set $upstream http://api:8080;
    proxy_pass $upstream;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location / {
    set $upstream http://web:3000;
    proxy_pass $upstream;
  }
}