services:
  app-postgres:
    image: postgres:16.14-alpine3.23
    ports:
      - ${DB_PORT}:5432
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - app-pgsql-data:/var/lib/postgresql/data
    networks:
      - base-net

  api:
    image: ghcr.io/data354/carbon-lens-api:latest@sha256:3e984a7bd5083f71457b2512caad7924a2afcbef88040e6f6c25b8ade3feb761
    expose:
      - ${API_PORT}
    secrets:
      - gcp-sa-secret
    environment:
      ENV: production
      DOCS_MODE: disabled
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa-secret
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
        parallelism: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - base-net

  web:
    image: ghcr.io/data354/carbon-lens-web:0.1.2@sha256:7ace0dc3d4cf0a751835640148023b12b12cb1c3a329e92d154c83db59c9a11c
    expose:
      - ${WEB_PORT}
    environment:
      NODE_ENV: production
      GEO_API_BASE_URL: ${GEO_API_BASE_URL}
      DATABASE_URL: ${WEB_DATABASE_URL}
      RESEND_API_KEY: ${WEB_RESEND_API_KEY}
      BETTER_AUTH_SECRET: ${WEB_BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${WEB_BETTER_AUTH_URL}
      DEFAULT_ADMIN_EMAIL: ${WEB_DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_NAME: ${WEB_DEFAULT_ADMIN_NAME}
      SKIP_ENV_VALIDATION: ${WEB_SKIP_ENV_VALIDATION}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - base-net

  nginx:
    image: nginx:1.25-alpine
    # Host mode keeps the real client IP (needed for per-IP rate limiting);
    # ingress mode would show the Swarm load balancer IP for every client
    ports:
      - target: 80
        published: ${NGINX_PORT}
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - base-net

networks:
  base-net:
    driver: overlay
    attachable: true

volumes:
  app-pgsql-data:
    driver: local

configs:
  nginx-conf:
    file: ./nginx/nginx.conf

secrets:
  gcp-sa-secret:
    file: ../apps/api/secrets/gcp-sa-key.json
