name: Build and deploy to the staging environment on Google Cloud Run

on:
  push:
    branches:
      - staging

env:
  REGION: ${{ vars.GC_REGION }}
  PROJECT: ${{ vars.GC_PROJECT }}
  SERVICE: ${{ vars.SERVICE }}
  REPO: ${{ vars.GC_REPO }}
  SA_KEY: ${{ secrets.GC_SA_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create staging .env file
        run: |-
          echo "${{ secrets.BASE64_ENV }}" | base64 -d > .env
          echo "✅ Staging .env file created"
          echo "API_URL=$(grep NEXT_PUBLIC_GEO_API_BASE_URL .env | cut -d '=' -f2)" >> $GITHUB_ENV
          echo "APP_URL=$(grep NEXT_PUBLIC_APP_URL .env | cut -d '=' -f2)" >> $GITHUB_ENV

      - name: Set image tag
        run: echo "IMAGE_TAG=$REGION-docker.pkg.dev/$PROJECT/$REPO/$SERVICE:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.11.0

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            API_URL=${{ env.API_URL }}
            APP_URL=${{ env.APP_URL }}

      # 4. Préparation des variables d'environnement pour le Runtime
      - name: "Prepare env vars for Cloud Run"
        id: vars
        run: |-
          VARS=$(grep -v '^#' .env \
            | grep '=' \
            | sed 's/"/\\"/g' \
            | sed 's/ /\\ /g' \
            | tr '\n' ',' \
            | sed 's/,$//'
          )
          echo "list=$VARS" >> $GITHUB_OUTPUT

      # 5. Déploiement final
      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE_TAG }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "${{ steps.vars.outputs.list }}"
